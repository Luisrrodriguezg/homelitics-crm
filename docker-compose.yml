# Two profiles, never run together:
#
#   docker compose --profile supabase up --build   # the real API against Supabase (.env)
#   docker compose --profile local    up --build   # throwaway Postgres, migrations, seed, bypassed auth
#
# `homelitics-api:latest` is built once (by the `api` service) and reused by the
# rest, so only one service carries `build:`.

services:
  # ---------------------------------------------------------------------------
  # Real API against Supabase. Everything comes from .env (gitignored + dockerignored).
  # ---------------------------------------------------------------------------
  api:
    profiles: ["supabase"]
    build: .
    image: homelitics-api:latest
    container_name: homelitics-api
    restart: unless-stopped
    env_file: .env
    environment:
      # On Supabase the sweep and the outbox relay run in pg_cron
      # (migrations/005_cron_jobs.sql). Running them here too would double up.
      ENABLE_SCHEDULER: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Local profile: throwaway Postgres + migrations + one-shot seed + bypassed API.
  #   docker compose --profile local up --build
  # No .env, no Supabase, no credentials.
  # ---------------------------------------------------------------------------
  db:
    profiles: ["local"]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # *.sql here run once, in filename order, on an empty data dir: 001→004.
      # 004's Realtime block is guarded behind an `auth` schema check → no-ops here.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    profiles: ["local"]
    build: .
    image: homelitics-api:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@db:5432/postgres
    volumes:
      - ./seed.py:/app/seed.py:ro
      - ./geo_medellin.py:/app/geo_medellin.py:ro
    command: ["python", "seed.py", "--scale", "small", "--seed", "42",
              "--months", "12", "--now", "2026-08-31T00:00:00Z"]
    restart: "no"

  api-local:
    profiles: ["local"]
    image: homelitics-api:latest
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/postgres
      SUPABASE_PROJECT_REF: local-dev
      DEV_AUTH_BYPASS: "true"
      ENABLE_SCHEDULER: "true"     # no pg_cron in postgres:17-alpine, so the API drives the jobs here
      LOG_LEVEL: INFO
    # One worker: the in-process scheduler (sweep + event relay) is not
    # multi-process safe — two workers would each run it and double every task.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
